<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4eee2">
<title>Paraíso Villas & Spa | Eventos Especiais</title>
<style>
:root{--cream:#f4eee2;--terracotta:#ad704d;--terracotta-hover:#965d3e;--text:#252321;--brown:#392719;--muted:#76533b;--line:#d3b79c;--white:#fffaf5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:0 24px 36px;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
a{color:inherit}
.page{width:100%;max-width:1080px;margin:0 auto}
.header{padding:34px 0 24px}
.logo{display:block;width:min(100%,340px);height:auto;margin:0 auto 24px;mix-blend-mode:multiply}
.kicker{margin:0 0 12px;color:var(--muted);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400}
h1{margin:0;color:var(--brown);font-size:clamp(34px,6vw,58px);letter-spacing:.045em;line-height:1.12}
.lead{max-width:600px;margin:20px auto 0;color:#594435;font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,2.4vw,21px);line-height:1.7}
.ornament{display:flex;align-items:center;justify-content:center;gap:13px;margin:29px auto 34px}
.ornament::before,.ornament::after{width:55px;height:1px;background:var(--line);content:""}
.ornament span{color:var(--terracotta);font-size:15px}

/* Galeria: fotos completas, nome por baixo */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:980px;margin:0 auto;align-items:start}
.event-card{padding:10px;border:1px solid var(--line);border-radius:3px;background:rgba(255,250,245,.55);transition:border-color .2s ease,transform .2s ease}
.event-card:hover{border-color:var(--terracotta);transform:translateY(-2px)}
.event-card img{display:block;width:100%;height:auto;border-radius:2px}
.event-description{padding:12px 6px 6px}
.event-description h2{margin:0;color:var(--brown);font-size:clamp(17px,2.2vw,20px);line-height:1.4;overflow-wrap:anywhere}
.status{grid-column:1/-1;margin:0 auto;max-width:520px;color:var(--muted);font-size:14px;line-height:1.7}

.back{display:inline-block;margin:38px auto 0;padding:13px 19px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--brown);font-size:14px;text-decoration:none;cursor:pointer;transition:background .2s ease,color .2s ease}
.back:hover{background:var(--brown);color:var(--white)}

.contacts{max-width:820px;margin:52px auto 0;padding:31px 12px 0;border-top:1px solid var(--line)}
.contacts h2{margin:0 0 22px;color:var(--brown);font-size:clamp(23px,3vw,29px)}
.contact-links{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px 35px}
.contact-links a{color:var(--brown);font-size:14px;line-height:1.6;text-decoration:none;overflow-wrap:anywhere;transition:color .2s ease}
.contact-links a:hover{color:var(--terracotta-hover);text-decoration:underline;text-underline-offset:4px}
.note{margin:25px 0 0;color:var(--muted);font-size:12px;letter-spacing:.13em}

@media(max-width:650px){body{padding:0 18px 28px}.header{padding-top:27px}.logo{width:min(100%,285px)}.galeria{grid-template-columns:1fr;gap:14px}.contacts{margin-top:38px;padding-top:26px}.contact-links{flex-direction:column;gap:13px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <img class="logo" src="../logo-paraiso.png" alt="Paraíso Villas & Spa" onerror="this.style.display='none'">
    <p class="kicker">Paraíso Villas & Spa</p>
    <h1>EVENTOS ESPECIAIS</h1>
    <p class="lead">Momentos únicos. Experiências memoráveis.</p>
    <div class="ornament" aria-hidden="true"><span>✦</span></div>
  </header>

  <section id="gallery" class="galeria" aria-label="Fotografias dos eventos especiais">
    <p class="status">A carregar...</p>
  </section>

  <a class="back" href="../eventos.html" onclick="if(history.length>1){history.back();return false;}">← Voltar</a>

  <footer class="contacts">
    <h2>Contactos para eventos</h2>
    <div class="contact-links">
      <a href="mailto:eventos@paraisovillas.pt">✉ eventos@paraisovillas.pt</a>
      <a href="tel:+351912426598">☎ +351 912 426 598</a>
    </div>
    <p class="note">Pevidém · Guimarães</p>
  </footer>
</main>

  <script>
    const owner = "rececaoparaiso1995-spec";
    const repo = "eventor-qr";
    const folder = "eventos-especiais";
    const gallery = document.getElementById("gallery");

    const imageExtensions = [
      ".jpg", ".jpeg", ".png", ".webp", ".gif"
    ];

    async function loadImages() {
      try {
        const apiUrl =
          `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

        const response = await fetch(apiUrl, {
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error("Não foi possível consultar a pasta.");
        }

        const files = await response.json();

        const images = files
          .filter(file =>
            file.type === "file" &&
            imageExtensions.some(ext =>
              file.name.toLowerCase().endsWith(ext)
            )
          )
          .sort((a, b) =>
            a.name.localeCompare(b.name, "pt",
              { numeric: true, sensitivity: "base" })
          );

        gallery.innerHTML = "";

        if (images.length === 0) {
          gallery.innerHTML = `
            <p class="status">
              Ainda não existem fotografias nesta secção.
              Volte mais tarde para descobrir os nossos eventos.
            </p>
          `;
          return;
        }

        images.forEach(file => {
          const card = document.createElement("article");
          card.className = "event-card";

          const img = document.createElement("img");
          img.src = file.download_url;
          img.alt = file.name.replace(/\.[^.]+$/, "")
            .replace(/[_-]+/g, " ");
          img.loading = "lazy";

          const description = document.createElement("div");
          description.className = "event-description";

          const title = document.createElement("h2");
          title.textContent = file.name
            .replace(/\.[^.]+$/, "")
            .replace(/[_-]+/g, " ");

          description.appendChild(title);
          card.appendChild(img);
          card.appendChild(description);
          gallery.appendChild(card);
        });

      } catch (error) {
        gallery.innerHTML = `
          <p class="status">
            Não foi possível carregar as fotografias.
            Verifique a ligação à Internet e tente novamente.
          </p>
        `;
      }
    }

    loadImages();
  </script>
</body>
</html>
