<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4eee2">
<title>Paraíso Villas & Spa | Eventos Especiais</title>
<style>
:root{--cream:#f4eee2;--terracotta:#ad704d;--terracotta-hover:#965d3e;--text:#252321;--brown:#392719;--muted:#76533b;--line:#d3b79c;--white:#fffaf5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:0 24px 36px;background:var(--cream);color:var(--text);font-family:Arial,Helvetica,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
a{color:inherit}
.page{width:100%;max-width:1080px;margin:0 auto}
.header{padding:34px 0 24px}
.logo{display:block;width:min(100%,340px);height:auto;margin:0 auto 24px;mix-blend-mode:multiply}
.kicker{margin:0 0 12px;color:var(--muted);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:400}
h1{margin:0;color:var(--brown);font-size:clamp(34px,6vw,58px);letter-spacing:.045em;line-height:1.12}
.lead{max-width:600px;margin:20px auto 0;color:#594435;font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,2.4vw,21px);line-height:1.7}
.ornament{display:flex;align-items:center;justify-content:center;gap:13px;margin:29px auto 34px}
.ornament::before,.ornament::after{width:55px;height:1px;background:var(--line);content:""}
.ornament span{color:var(--terracotta);font-size:15px}

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:980px;margin:0 auto}
.galeria a{display:block;padding:8px;border:1px solid var(--line);border-radius:3px;background:rgba(255,250,245,.55);transition:border-color .2s ease,transform .2s ease}
.galeria a:hover{border-color:var(--terracotta);transform:translateY(-2px)}
.galeria img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px}
.galeria .nome{display:block;margin-top:9px;padding:0 4px 4px;color:var(--brown);font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.estado{margin:0 auto;color:var(--muted);font-size:14px;line-height:1.6}

.back{display:inline-block;margin:38px auto 0;padding:13px 19px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--brown);font-size:14px;text-decoration:none;cursor:pointer;transition:background .2s ease,color .2s ease}
.back:hover{background:var(--brown);color:var(--white)}

.lightbox{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(37,35,33,.9);cursor:zoom-out}
.lightbox.aberto{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:2px}

.contacts{max-width:820px;margin:52px auto 0;padding:31px 12px 0;border-top:1px solid var(--line)}
.contacts h2{margin:0 0 22px;color:var(--brown);font-size:clamp(23px,3vw,29px)}
.contact-links{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:16px 35px}
.contact-links a{color:var(--brown);font-size:14px;line-height:1.6;text-decoration:none;overflow-wrap:anywhere;transition:color .2s ease}
.contact-links a:hover{color:var(--terracotta-hover);text-decoration:underline;text-underline-offset:4px}
.note{margin:25px 0 0;color:var(--muted);font-size:12px;letter-spacing:.13em}

@media(max-width:650px){body{padding:0 18px 28px}.header{padding-top:27px}.logo{width:min(100%,285px)}.galeria{grid-template-columns:1fr;gap:12px}.contacts{margin-top:38px;padding-top:26px}.contact-links{flex-direction:column;gap:13px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="header">
    <img class="logo" src="../logo-paraiso.png" alt="Paraíso Villas & Spa" onerror="this.style.display='none'">
    <p class="kicker">Paraíso Villas & Spa</p>
    <h1>EVENTOS ESPECIAIS</h1>
    <p class="lead">Momentos únicos. Experiências memoráveis.</p>
    <div class="ornament" aria-hidden="true"><span>✦</span></div>
  </header>

  <section id="galeria" class="galeria" aria-label="Fotografias dos eventos especiais">
    <p class="estado" id="estado">A carregar...</p>
  </section>

  <a class="back" href="../eventos.html" onclick="if(history.length>1){history.back();return false;}">← Voltar</a>

  <footer class="contacts">
    <h2>Contactos para eventos</h2>
    <div class="contact-links">
      <a href="mailto:eventos@paraisovillas.pt">✉ eventos@paraisovillas.pt</a>
      <a href="tel:+351912426598">☎ +351 912 426 598</a>
    </div>
    <p class="note">Pevidém · Guimarães</p>
  </footer>
</main>

<div class="lightbox" id="lightbox" aria-hidden="true"><img id="lightboxImg" alt=""></div>

<script>
  // Plano B: se a lista automática falhar, escreve aqui os nomes das fotos
  const FOTOS_MANUAL = [
    // "foto1.jpg",
    // "foto2.jpg"
  ];

  const EXT = /\.(jpe?g|png|gif|webp)$/i;
  const galeria = document.getElementById("galeria");
  const estado = document.getElementById("estado");

  function mostrar(nomes) {
    galeria.innerHTML = "";
    if (!nomes.length) {
      galeria.innerHTML = '<p class="estado">Em breve teremos novidades.</p>';
      return;
    }
        nomes.forEach(nome => {
      const a = document.createElement("a");
      a.href = encodeURI(nome);

      const img = document.createElement("img");
      img.src = encodeURI(nome);
      // nome sem extensão, com _ e - trocados por espaços
      const titulo = nome.replace(EXT, "").replace(/[_-]+/g, " ");
      img.alt = titulo;
      img.loading = "lazy";

      const legenda = document.createElement("span");
      legenda.className = "nome";
      legenda.textContent = titulo;

      a.appendChild(img);
      a.appendChild(legenda);
      a.addEventListener("click", e => {
        e.preventDefault();
        document.getElementById("lightboxImg").src = img.src;
        document.getElementById("lightbox").classList.add("aberto");
      });
      galeria.appendChild(a);
    });

  // Descobre sozinho utilizador/repositório/pasta a partir do endereço do GitHub Pages
  async function listarFotos() {
    let caminho = location.pathname;
    if (!caminho.endsWith("/")) caminho = caminho.replace(/[^/]*$/, "");
    const partes = caminho.split("/").filter(Boolean);
    const utilizador = location.hostname.split(".")[0];
    const repo = partes[0];
    const pasta = partes.slice(1).join("/");

    const r = await fetch(
      `https://api.github.com/repos/${utilizador}/${repo}/contents/${pasta}`
    );
    if (!r.ok) throw new Error("API " + r.status);
    const ficheiros = await r.json();
    return ficheiros
      .filter(f => f.type === "file" && EXT.test(f.name))
      .map(f => f.name)
      .sort((a, b) => a.localeCompare(b, "pt", { numeric: true }));
  }

  if (FOTOS_MANUAL.length) {
    mostrar(FOTOS_MANUAL);
  } else {
    listarFotos().then(mostrar).catch(() => {
      estado.textContent = "Não foi possível carregar as fotografias.";
    });
  }

  const lb = document.getElementById("lightbox");
  lb.addEventListener("click", () => lb.classList.remove("aberto"));
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") lb.classList.remove("aberto");
  });
</script>
</body>
</html>
