<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4eee2">
<title>Eventos | Paraíso Villas & Spa</title>
<style>
:root{--cream:#f4eee2;--terracotta:#ad704d;--terracotta-hover:#965d3e;--text:#252321;--brown:#392719;--muted:#76533b;--line:#d3b79c}
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--text);text-align:center;margin:0;min-height:100vh;padding:0 22px 40px}
a{color:inherit}
.page{width:100%;max-width:900px;margin:0 auto;padding-top:35px}
.logo{display:block;width:min(100%,420px);height:auto;margin:0 auto 12px;mix-blend-mode:multiply}
.kicker{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:clamp(30px,5vw,46px);color:var(--brown);margin:8px 0 12px}
h2{font-size:clamp(21px,3vw,28px);color:var(--brown);margin:0 0 10px}
.lead{font-size:clamp(16px,2.2vw,20px);line-height:1.55;color:#594435;max-width:680px;margin:0 auto}
.actions{display:grid;gap:18px;margin:36px auto 30px;max-width:780px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-decoration:none;background:var(--terracotta);color:#21150f;border:0;border-radius:13px;padding:20px 16px;min-height:125px;font-size:clamp(18px,2.6vw,25px);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0 / 8%);transition:background .15s ease,transform .15s ease}
.btn:hover{background:var(--terracotta-hover);color:#fffaf5}
.btn small{font-size:14px;font-weight:400;line-height:1.4}
.btn.main{min-height:145px}
.secondary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:780px;margin:0 auto}
.secondary .btn{min-height:112px;padding:17px 10px;font-size:17px}
.symbol{font-size:27px;line-height:1}
.back{display:inline-block;margin:8px auto 22px;padding:12px 18px;background:#555;color:#fff;text-decoration:none;border-radius:7px}
.back:hover{background:#3d3d3d}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;text-align:left;margin:28px auto;max-width:780px}
.event-card{border:1px solid var(--line);border-radius:12px;padding:20px;background:rgba(255,255,255,.18)}
.event-card p{line-height:1.55;margin:0;color:#594435}
.event-card .symbol{margin-bottom:12px;color:#8a583a}
.form{max-width:650px;margin:28px auto;text-align:left;display:grid;gap:14px}
label{display:grid;gap:7px;font-weight:600;color:var(--brown)}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:7px;background:#fffdf9;color:var(--text)}
textarea{min-height:130px;resize:vertical}
.submit{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px;padding:15px;background:var(--terracotta);color:#21150f}
.note{font-size:13px;line-height:1.5;color:var(--muted)}
@media(max-width:560px){body{padding:0 16px 28px}.page{padding-top:25px}.logo{width:min(100%,330px)}.secondary{gap:12px}.secondary .btn{font-size:15px;min-height:105px}.cards{grid-template-columns:1fr}.btn{border-radius:10px}}
</style>

</head>
<body>
<main class="page">
<img class="logo" src="logo-paraiso.png" alt="Paraíso Villas & Spa" onerror="this.style.display='none'">

<p class="kicker">Paraíso Villas & Spa</p>
<h1>EVENTOS</h1>
<p class="lead">Momentos únicos. Experiências memoráveis.</p>
<section class="actions">
<a class="btn main" href="eventos.html"><span class="symbol">✦</span><span>Todos os eventos</span><small>Descubra tudo o que podemos organizar</small></a>
<a class="btn main" href="personalizar.html"><span class="symbol">✧</span><span>Personalize o seu evento</span><small>Vamos criar uma experiência à sua medida</small></a>
</section>
<nav class="secondary" aria-label="Outras informações">
<a class="btn" href="carta_rest.pdf"><span class="symbol">♨</span><span>Carta do restaurante</span></a>
<a class="btn" href="carta_spa.pdf"><span class="symbol">❀</span><span>Carta do Spa</span></a>
<a class="btn" href="villas.html"><span class="symbol">⌂</span><span>As nossas Villas</span></a>
<a class="btn" href="tipos-eventos.html"><span class="symbol">☷</span><span>Tipos de eventos</span></a>
</nav>
<p class="note" style="margin-top:25px">Pevidém · Guimarães</p>

</main>
</body>
</html>
